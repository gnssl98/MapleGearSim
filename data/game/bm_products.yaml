# 확률형 BM 상품 분류 · 구매 방법(묶음) 가격
# kind:
#   fixed  — 확률이 거의 바뀌지 않는 상시 상품. 확률표는 data/game/bm_tables.json(하드코딩 스냅숏)만 쓴다.
#   event  — 구성·확률이 주기적으로 바뀌는 상품(로얄·마스터피스·콜라보·기간 판매 등). 한 달마다 공식 확률 페이지에서 새로 받는다.
#   목록에 없는 새 상품은 event 로 본다.
# options: 구매 방법 [{label, count(개수), price(원=캐시), where}] — 화면에서 고르면 그 묶음 단위로 계산.
#   공식 캐시샵 공지·메이플 상점은 가격이 이미지/스크립트라 자동으로 읽지 못해서, 출처가 있는 값만 넣었다.
#   price_date 이후 캐시샵 공지가 올라오면 화면에 "가격 확인" 알림.
# note: 판매 종료·직접 구매 불가 등 안내.
