# 장비 분류 보조 데이터
# 근거: docs/research/09_flame_verification.md §4 (보스 추옵 = 항상 4줄, 단계 +2)

# 이름에 포함되면 보스 추옵 장비로 판정
boss_flame_keywords:
  - 에테르넬
  - 아케인셰이드
  - 앱솔랩스
  - 제네시스
  - 하이네스
  - 이글아이
  - 트릭스터
  - 파프니르
  # 칠흑 (보스 장신구)
  - 몽환의 벨트
  - 거대한 공포
  - 커맨더 포스 이어링
  - 고통의 근원
  - 루즈 컨트롤 머신 마크
  - 마력이 깃든 안대
  - 저주받은
  - 미트라의 분노
  - 창세의 뱃지
  # 여명
  - 가디언 엔젤 링
  - 데이브레이크 펜던트
  - 에스텔라 이어링
  - 트와일라이트 마크
  # 보스 장신구 세트
  - 골든 클로버 벨트
  - 블랙빈 마크
  - 응축된 힘의 결정석
  - 파풀라투스 마크
  - 아쿠아틱 레터 눈장식
  - 지옥의 불꽃
  - 도미네이터 펜던트
  - 데아 시두스 이어링
  - 실버블라썸 링
  - 고귀한 이피아의 반지
  - 분노한 자쿰의 벨트
  - 크리스탈 웬투스 뱃지

# 이름에 포함되면 보스 추옵 판정에서 제외 (1~5단계)
non_boss_flame_keywords:
  - 혼돈의 핑크빛 목걸이
  - 영생의 돌
  - 골럭스

# 직접 강화(스타포스·잠재 재설정) 불가 장비: 직작 계산 대상에서 제외
no_craft_keywords:
  - 도전자의       # 이벤트 장비, 미션으로 성장 (docs/research/07)

# 스타포스 강화 불가 (성급 고정) ⚠ 2025-03 30성 개편 이후 변경 여부 미확인
no_starforce_keywords:
  - 제네시스       # 제네시스 무기: 22성 고정

# 오픈 API item_equipment_slot → 계산기 부위 id
slot_map:
  모자: hat
  상의: top
  하의: bottom
  한벌옷: overall
  신발: shoes
  장갑: gloves
  망토: cape
  어깨장식: shoulder
  벨트: belt
  얼굴장식: face
  눈장식: eye
  귀고리: earring
  반지1: ring
  반지2: ring
  반지3: ring
  반지4: ring
  펜던트: pendant
  펜던트2: pendant
  기계 심장: heart
  무기: weapon
  보조무기: secondary
  엠블렘: emblem

# 세트 효과 소속: API set_name 에 키가 포함되면 → 이름에 키워드가 들어간 장비가 그 세트 구성품
# (환산 기여도에서 "이 장비를 빼면 세트 단계가 내려간다"를 계산할 때 사용)
# 럭키 아이템(제네시스 무기 등) 규칙은 미반영
set_members:
  에테르넬 세트: [에테르넬]
  아케인셰이드 세트: [아케인셰이드]
  앱솔랩스 세트: [앱솔랩스]
  루타비스 세트: [하이네스, 이글아이, 트릭스터, 파프니르]
  도전자의 장비 세트: [도전자의]
  블랙 세트: [블랙 ]
  여명의 보스 세트: [가디언 엔젤 링, 데이브레이크 펜던트, 에스텔라 이어링, 트와일라이트 마크]
  칠흑의 보스 세트: [몽환의 벨트, 거대한 공포, 커맨더 포스 이어링, 고통의 근원, 루즈 컨트롤 머신 마크,
                    마력이 깃든 안대, 저주받은, 미트라의 분노, 창세의 뱃지]
  보스 장신구 세트: [응축된 힘의 결정석, 아쿠아틱 레터 눈장식, 블랙빈 마크, 파풀라투스 마크, 지옥의 불꽃,
                   도미네이터 펜던트, 데아 시두스 이어링, 골든 클로버 벨트, 분노한 자쿰의 벨트, 실버블라썸 링,
                   고귀한 이피아의 반지, 크리스탈 웬투스 뱃지, 핑크빛 성배, 영생의 돌, 혼돈의 핑크빛 목걸이,
                   로얄 블랙메탈 숄더]

# 강화 가계부: 스타포스 기록에는 장비 레벨이 없어, 이름 키워드로 레벨 추정
# (캐릭터 장착 장비·잠재 기록의 레벨이 우선, 여기 없으면 가계부 화면에서 직접 지정)
item_level_keywords:
  에테르넬: 250
  아케인셰이드: 200
  제네시스: 200
  앱솔랩스: 160
  하이네스: 150
  이글아이: 150
  트릭스터: 150
  파프니르: 150
  마이스터: 140
